name: Build GameSpace APK

on:
  workflow_dispatch:
  push:
    branches: [17.0]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          echo "y" | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpace-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameSpace build ${{ github.run_number }}
          body: Automated debug build of GameSpace from ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
